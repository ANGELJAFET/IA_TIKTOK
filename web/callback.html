<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorization – Fact Drop Studio</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Authorization</h1><div id="out">Reading code…</div>
<script>
const p=new URLSearchParams(location.search),c=p.get("code"),e=p.get("error"),o=document.getElementById("out");
if(c){o.innerHTML="<p>Copy this code and paste it in the terminal:</p><code></code>";o.querySelector("code").textContent=c;}
else{o.textContent="No code received."+(e?" Error: "+e+" – "+(p.get("error_description")||""):"");}
</script></body></html>
