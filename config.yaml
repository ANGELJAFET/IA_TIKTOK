# ===== PAUSA =====
# true = no se genera ningún video automático (no se gastan créditos). Pon false para reanudar.
pausado: false

# ===== Configuración del canal =====
# Cambia el nicho aquí y el resto del pipeline se adapta.
canal:
  nicho: "historias de ficción coreana estilo manhwa/murim: artes marciales, poderes ocultos, sectas, venganza y romance, narradas como recap de manhwa"
  idioma: "español latinoamericano neutro, narración dramática y épica"
  publico: "Latinoamérica, 13-35 años, fans de anime, manhwa y doramas"
  estilo_visual: "Korean manhwa webtoon illustration, murim martial arts fantasy, dramatic lighting, glowing qi energy effects, sharp detailed line art, cinematic composition, vertical 9:16 panel"
  hashtags_base: ["#manhwa", "#murim", "#manhwarecap", "#webtoon", "#historias", "#parati"]
  # Reglas para planear cada serie (se le pasan a la IA)
  reglas_serie: |
    - Mundo coreano de artes marciales (murim): sectas, clanes, montañas sagradas, posadas, mercados, palacios.
    - Protagonista con PODER OCULTO que todos subestiman (ej. la hija de un maestro retirado que baja de la montaña;
      el sirviente que en realidad es el mayor espadachín; el joven expulsado que regresa en el tiempo).
    - Ganchos que enganchan: humillaciones públicas que terminan en revancha épica, pretendientes arrogantes,
      herencias de técnicas secretas, traiciones de la propia secta, enemigos que descubren demasiado tarde quién es.
    - Cada parte con al menos un momento de PODER revelado o una PELEA corta y épica, y un giro.
    - Nombres coreanos (Seo-yeon, Ha-eun, Do-hyun, Jin-woo...), nombres de técnicas épicos ("Espada de las Nueve Nubes").
  # Reglas para escribir cada parte
  reglas_parte: |
    - La historia avanza sobre todo con DIÁLOGOS: al menos el 70% de las líneas son de personajes.
      El NARRADOR casi no interrumpe: solo una frase corta para abrir, transiciones breves y el cierre en suspenso
      (máximo 1 línea de narrador por escena, de 15 palabras o menos).
    - Los personajes hablan como en manhwa: el arrogante presume, el viejo maestro es sabio, la protagonista es fría y segura.
    - Peleas descritas con impacto: movimientos, nombres de técnicas, la reacción de los testigos ("¡¿Qué?! ¡Imposible!").
    - Sin groserías fuertes; violencia de artes marciales sin sangre explícita.

# ===== Series =====
# Cada tema se convierte en una serie de N partes (1 video por día).
# Pon 1 si quieres videos sueltos.
serie:
  partes: 7

# ===== Llamado a la acción al final de cada video =====
cta:
  comentar_parte: true   # pide comentar "PARTE N"   # "Comenta PARTE 2 si la quieres" -> más comentarios = más alcance
  # Cuando tengas Ko-fi/Buy Me a Coffee en tu bio (TikTok pide 1,000 seguidores para poner enlaces),
  # escribe aquí la frase, p. ej.: "Want more series? Support the channel, link in bio."
  apoyo: ""

# ===== Frecuencia (según vistas totales del canal) =====
# El cron corre todos los días, pero solo genera (y gasta créditos) cuando toca.
frecuencia:
  - {desde_vistas: 0, cada_dias: 3}   # siempre cada 3 días

# ===== Visuales =====
# "pexels" -> videos de stock reales, GRATIS (necesita PEXELS_API_KEY)
# "gemini" -> imágenes generadas con IA (≈ $0.034 c/u, necesita facturación activa en Google)
visuales: "gemini"   # si una imagen falla y hay PEXELS_API_KEY, usa Pexels de respaldo

# ===== Animación (personajes que se mueven, con Veo de Google; se paga con los mismos créditos) =====
# "imagenes" -> solo imágenes con zoom           (~$0.21 por video)
# "mixto"    -> 2 escenas animadas, resto imagen  (~$0.70 por video)
# "completo" -> todas las escenas animadas         (~$1.65 por video)
animacion:
  modo: "imagenes"   # Veo no está disponible para esta clave de Gemini (ver tools/listar_modelos.py)
  modelo: "auto"     # elige el Veo más barato disponible (Lite)
  segundos: 8

# ===== Modelos de Google (Gemini API) =====
# Si Google cambia los nombres, ejecuta: python tools/listar_modelos.py
modelos:
  texto: "gemini-3.1-flash-lite"
  imagen: "gemini-3.1-flash-lite-image"

# ===== Video =====
video:
  escenas: 6              # imágenes por video (≈ $0.034 c/u). 6 = ahorro; cada imagen dura ~11 s con movimiento
  palabras_objetivo: 175  # ≈ 65-70 s de narración (TikTok paga solo videos de +1 minuto)
  duracion_minima: 62      # segundos; si queda más corto se alarga la última escena
  ancho: 1080
  alto: 1920
  fps: 30
  volumen_musica: 0.12    # pon archivos .mp3 sin copyright en assets/musica/

# ===== Voz (edge-tts, gratis) =====
voz:
  nombre: "es-MX-JorgeNeural"   # narrador épico; los personajes reciben otras voces distintas
  velocidad: "+15%"

# ===== TikTok =====
tiktok:
  # false = cada día solo GENERA el video y te lo manda por correo para que lo subas tú.
  # Ponlo en true cuando TikTok apruebe la app (y cambia privacidad a PUBLIC_TO_EVERYONE).
  publicar_automatico: false
  # "directo"  -> publica en el perfil
  # "borrador" -> lo manda a tu bandeja de TikTok para que lo publiques tú (revisión manual)
  modo: "directo"   # se publica en tu perfil; mientras la app no esté aprobada sale en PRIVADO (solo tú)
  # Mientras la app NO esté auditada por TikTok, solo se permite SELF_ONLY (privado).
  # Después de la auditoría cambia a PUBLIC_TO_EVERYONE.
  privacidad: "SELF_ONLY"
  desactivar_comentarios: false
  desactivar_duo: false
  desactivar_stitch: false

# ===== Panel web (docs/panel.html) =====
panel:
  # TikTok NO da los ingresos por API: el panel muestra un ESTIMADO = vistas / 1000 × este valor.
  # Creator Rewards suele pagar ~0.40–1.00 USD por 1000 vistas válidas, pero exige videos de +1 minuto
  # y 10,000 seguidores. Pon 0 si aún no estás en un programa de pago.
  usd_por_1000_vistas: 0.5
  minimo_retiro_usd: 10        # TikTok exige un saldo mínimo para retirar; ajústalo si TikTok te muestra otro
  pico_crecimiento_pct: 5      # si un video crece menos de esto en 48 h, se considera en su punto máximo
  costo_por_video_usd: 0.21   # gasto aproximado en Gemini por video
