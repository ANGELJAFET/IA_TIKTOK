# ===== Configuración del canal =====
# Cambia el nicho aquí y el resto del pipeline se adapta.
canal:
  nicho: "mind-blowing facts (science, history, nature, the human body, space)"
  idioma: "English (US)"
  publico: "United States, ages 18-35"
  estilo_visual: "cinematic, photorealistic, dramatic lighting, high detail, vertical composition"
  hashtags_base: ["#facts", "#didyouknow", "#learnontiktok", "#mindblown"]

# ===== Series =====
# Cada tema se convierte en una serie de N partes (1 video por día).
# Pon 1 si quieres videos sueltos.
serie:
  partes: 7

# ===== Llamado a la acción al final de cada video =====
cta:
  comentar_parte: true   # "Comment PART 2 if you want it" -> más comentarios = más alcance
  # Cuando tengas Ko-fi/Buy Me a Coffee en tu bio (TikTok pide 1,000 seguidores para poner enlaces),
  # escribe aquí la frase, p. ej.: "Want more series? Support the channel, link in bio."
  apoyo: "If you enjoy these, consider supporting the channel. Link in bio."

# ===== Visuales =====
# "pexels" -> videos de stock reales, GRATIS (necesita PEXELS_API_KEY)
# "gemini" -> imágenes generadas con IA (≈ $0.034 c/u, necesita facturación activa en Google)
visuales: "gemini"   # si una imagen falla y hay PEXELS_API_KEY, usa Pexels de respaldo

# ===== Modelos de Google (Gemini API) =====
# Si Google cambia los nombres, ejecuta: python tools/listar_modelos.py
modelos:
  texto: "gemini-3.1-flash-lite"
  imagen: "gemini-3.1-flash-lite-image"

# ===== Video =====
video:
  escenas: 4              # imágenes por video (≈ $0.034 c/u)
  palabras_objetivo: 50   # ≈ 20 segundos de narración
  ancho: 1080
  alto: 1920
  fps: 30
  volumen_musica: 0.12    # pon archivos .mp3 sin copyright en assets/musica/

# ===== Voz (edge-tts, gratis) =====
voz:
  nombre: "en-US-AndrewNeural"   # otras: en-US-GuyNeural, en-US-AriaNeural, en-US-ChristopherNeural
  velocidad: "+8%"

# ===== TikTok =====
tiktok:
  # false = cada día solo GENERA el video y te lo manda por correo para que lo subas tú.
  # Ponlo en true cuando TikTok apruebe la app (y cambia privacidad a PUBLIC_TO_EVERYONE).
  publicar_automatico: false
  # "directo"  -> publica en el perfil
  # "borrador" -> lo manda a tu bandeja de TikTok para que lo publiques tú (revisión manual)
  modo: "directo"   # se publica en tu perfil; mientras la app no esté aprobada sale en PRIVADO (solo tú)
  # Mientras la app NO esté auditada por TikTok, solo se permite SELF_ONLY (privado).
  # Después de la auditoría cambia a PUBLIC_TO_EVERYONE.
  privacidad: "SELF_ONLY"
  desactivar_comentarios: false
  desactivar_duo: false
  desactivar_stitch: false

# ===== Panel web (docs/panel.html) =====
panel:
  # TikTok NO da los ingresos por API: el panel muestra un ESTIMADO = vistas / 1000 × este valor.
  # Creator Rewards suele pagar ~0.40–1.00 USD por 1000 vistas válidas, pero exige videos de +1 minuto
  # y 10,000 seguidores. Pon 0 si aún no estás en un programa de pago.
  usd_por_1000_vistas: 0.5
  costo_por_video_usd: 0.14   # gasto aproximado en Gemini por video
