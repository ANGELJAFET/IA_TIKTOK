name: Actualizar estadísticas

# Casi tiempo real: cada ejecución dura ~29 min consultando TikTok cada minuto, y se relanza cada 30 min.
# No gasta créditos de Google (solo consulta la API de TikTok).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estadisticas
  cancel-in-progress: true

jobs:
  estadisticas:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leer estadísticas de TikTok
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          git config user.name "tiktok-bot"
          git config user.email "bot@users.noreply.github.com"
          python main.py --solo-estadisticas --bucle 28
      - name: Renovar token de TikTok si cambió
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f .nuevo_refresh_token ] && [ -n "$GH_TOKEN" ]; then
            gh secret set TIKTOK_REFRESH_TOKEN --repo "${{ github.repository }}" < .nuevo_refresh_token
          fi
      - name: Guardar datos
        run: |
          git config user.name "tiktok-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Estadísticas $(date -u +%F' '%H:%M)" && git pull --rebase -q && git push)
